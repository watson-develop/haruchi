# Supabase 무료 티어는 ~1주 무요청이면 일시정지된다(설계 「감수한 것」). 매일 깨운다.
#
# **주 1회였다가 2026-09-17에 매일로 바꿨다.** 이유가 둘이고, 둘 다 같은 사고에서 나왔다.
#
# 1. **여유가 0이었다.** 주 1회는 정확히 168시간 간격인데 일시정지 기준도 ~7일이다.
#    GitHub의 예약 실행은 best-effort라 부하가 높으면 지연되거나 아예 건너뛴다 — 한 번만
#    밀려도 임계값을 넘는다. 주기가 임계값과 같으면 그건 방어가 아니라 동전 던지기다.
# 2. **실제로 한 번도 안 돌았다.** 2026-08-07 도입 후 41일간 실행 0회(레포 전체 schedule
#    이벤트도 0회)인 채로 2026-09-16 일시정지 예고 메일을 받았다. 같은 기간 push로 도는
#    deploy는 116회 전부 성공했고 수동 dispatch도 성공한다 — 키·URL·서버·Actions가 전부
#    정상이고 고장난 것은 예약 등록 하나뿐이었다. 예약이 등록되지 않은 워크플로를 되살리는
#    처방이 "기본 브랜치에 파일을 다시 push"라서, 이 수정이 주기 확보와 재등록을 겸한다.
#
# **`state: active`를 근거로 삼지 말 것.** 파일이 기본 브랜치에 있기만 하면 무조건 active로
# 보이고, 스케줄러가 cron을 집어갔는지는 전혀 보증하지 않는다. 유일한 증거는 실행 이력이다:
#
#     gh run list --workflow=ping-supabase.yml
#
# 그래서 이 파일을 고친 뒤에는 **하루 지나 예약 실행이 이력에 실제로 찍혔는지 확인한다.**
# 「고쳤다」와 「돈다」는 다른 주장이고, 이 워크플로는 정확히 그 간극에서 죽어 있었다.
#
# 분을 :00으로 두지 않는다 — 정각은 전 세계 예약이 몰려 지연·누락이 가장 잦은 시각이다.
#
# publishable 키(`sb_publishable_...`, 옛 이름 anon)는 공개 전제다 — RLS가 막으므로
# GitHub Actions 시크릿이 아니라 평문으로 둔다. 사람이 값을 채운다.
name: ping-supabase
on:
  schedule:
    - cron: '37 20 * * *' # 매일 20:37 UTC = 05:37 KST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping
        run: |
          # 값은 src/data/sync-config.ts와 같아야 한다(supabase/README.md 「4. 앱에 접속
          # 정보를 넣고 배포」). 프로젝트를 새로 만들면 두 곳을 함께 고친다.
          #
          # --retry는 일시적 5xx·네트워크 흔들림만 다시 친다. 폐기된 키 같은 4xx는 재시도
          # 없이 즉시 실패한다 — 거짓 경보는 줄이고 진짜 고장은 그대로 시끄럽게 둔다.
          # --fail이 그 시끄러움의 근거다: 실패하면 GitHub이 메일을 보내고, 그게 이
          # 워크플로의 두 번째 일이다(깨우기 + 키가 아직 통하는지 감시).
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -H "apikey: sb_publishable_hYp3JpvfdDulSbtWO3qN4Q_pDzeVMmb" \
            "https://ozqdaxjtyqaizcfrewed.supabase.co/rest/v1/meta?select=id" > /dev/null
